services:
  mysql:
    image: mysql:8.0
    container_name: shop-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: shop_db
      MYSQL_USER: shop_user
      MYSQL_PASSWORD: shop_password
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
