services:
  mysql:
    image: mysql:8.0
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: shop_db
      MYSQL_USER: shop_user
      MYSQL_PASSWORD: shop_password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 30
  backend:
    image: gradle:8.14-jdk21
    working_dir: /app
    command: ["gradle", "--no-daemon", "bootRun", "--args=--spring.datasource.url=jdbc:mysql://mysql:3306/shop_db?useSSL=false&serverTimezone=Asia/Tokyo&allowPublicKeyRetrieval=true"]
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      ADMINISTRATOR_USER_ID: ${ADMINISTRATOR_USER_ID:-}
      ADMINISTRATOR_PASSWORD: ${ADMINISTRATOR_PASSWORD:-}
      IMPORT_DEMO_CUSTOMERS: ${IMPORT_DEMO_CUSTOMERS:-false}
    volumes:
      - .:/app
      - gradle-cache:/home/gradle/.gradle
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    image: oven/bun:1.3.11
    working_dir: /app
    command: ["sh", "-c", "bun install --frozen-lockfile && bun run dev --host 0.0.0.0 --port 5173 --strictPort"]
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
    volumes:
      - ../frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend
volumes:
  mysql-data:
  gradle-cache:
  frontend-node-modules:
