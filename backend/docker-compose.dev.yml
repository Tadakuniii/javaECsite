services:
  mysql:
    image: mysql:8.0
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: shop_db
      MYSQL_USER: shop_user
      MYSQL_PASSWORD: shop_password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 30
  backend:
    image: gradle:8.14-jdk21
    working_dir: /app
    command: ["gradle", "--no-daemon", "bootRun", "--args=--spring.datasource.url=jdbc:mysql://mysql:3306/shop_db?useSSL=false&serverTimezone=Asia/Tokyo&allowPublicKeyRetrieval=true"]
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - .:/app
      - gradle-cache:/home/gradle/.gradle
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql-data:
  gradle-cache:
