<!DOCTYPE html>

<head>
<meta charset="utf-8">
<title>Registration</title>
</head>
<body>
<h3>入力されたユーザIDは登録済です</h3>
<form action="/registid" method="post">
	<p>ユーザIDを入力してください<br>
	<input type="text" name="userid"></p>

</form>
</body>
