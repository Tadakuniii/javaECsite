spring.application.name=Shop

# MySQL connection settings
spring.datasource.url=jdbc:mysql://localhost:3306/shop_db?useSSL=false&serverTimezone=Asia/Tokyo&allowPublicKeyRetrieval=true
spring.datasource.username=shop_user
spring.datasource.password=shop_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Session cookies are not accessible to JavaScript.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# 管理者は環境変数のIDとパスワードが両方設定された場合だけ作成する。
shop.administrator-user-id=${ADMINISTRATOR_USER_ID:}
shop.administrator-password=${ADMINISTRATOR_PASSWORD:}

# リポジトリ内の学習用アカウントは明示的に有効化した開発環境だけで取り込む。
shop.import-demo-customers=${IMPORT_DEMO_CUSTOMERS:false}
